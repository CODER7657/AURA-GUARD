ci:
  collect:
    staticDistDir: ./site
    url:
      - http://localhost/index.html
    numberOfRuns: 3
  assert:
    assertions:
      "categories:accessibility": ["error", { minScore: 0.95, aggregationMethod: pessimistic }]
      "categories:best-practices": ["error", { minScore: 0.95, aggregationMethod: pessimistic }]
      "categories:performance": ["error", { minScore: 0.8, aggregationMethod: median-run }]
  upload:
    target: filesystem
    outputDir: .lighthouseci
