name: live forecast
# Every hour: fetch the latest AirNow NO2 hours, run the data contract and the deployed
# model, and publish ml/live/forecasts.json on the `live-data` branch, which the static
# site reads. Each run is also appended to a daily history file, so live accuracy can be
# scored later against what was actually measured. The hourly commits are repository
# activity, which keeps this schedule from being auto-disabled.
on:
  schedule:
    - cron: "25 * * * *"  # AirNow posts most of an hour's data by about :20
  workflow_dispatch:
  # Dry run on PRs that touch the pipeline: same fetch, contract and model, nothing published.
  pull_request:
    paths:
      - ".github/workflows/live-forecast.yml"
      - "ml/src/auraguard/**"
      - "ml/scripts/live_forecast.py"
      - "ml/models/**"

permissions:
  contents: write

concurrency:
  group: live-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements-monitor.txt
      # The model bundle is a pickle: load it with the library versions it was saved with.
      - name: install
        working-directory: ml
        run: pip install -r requirements-monitor.txt && pip install --no-deps -e .
      - name: forecast
        id: forecast
        working-directory: ml
        env:
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
        run: |
          set +e
          python scripts/live_forecast.py --out "$RUNNER_TEMP/forecasts.json"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
      - name: publish to live-data
        if: steps.forecast.outputs.code == '0' && github.event_name != 'pull_request'
        run: |
          git config user.name "aura-guard-bot"
          git config user.email "aura-guard-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin live-data >/dev/null; then
            git fetch --depth 1 origin live-data
            git switch -C live-data FETCH_HEAD
          else
            git switch --orphan live-data
            git rm -rf --quiet . || true
          fi
          mkdir -p ml/live/history
          cp "$RUNNER_TEMP/forecasts.json" ml/live/forecasts.json
          day=$(date -u +%F)
          python -c "import json,sys; d=json.load(open('ml/live/forecasts.json')); print(json.dumps({k: d[k] for k in ('issued_at_utc','data_as_of_utc','stations')}, separators=(',',':')))" >> "ml/live/history/$day.jsonl"
          # Score past forecasts against the readings that followed (MAE vs persistence).
          # This work tree is live-data, so the scorer comes from this workflow's commit.
          mkdir -p "$RUNNER_TEMP/code"
          git archive "${{ github.sha }}" ml/src/auraguard ml/scripts/score_live.py | tar -x -C "$RUNNER_TEMP/code"
          PYTHONPATH="$RUNNER_TEMP/code/ml/src" python "$RUNNER_TEMP/code/ml/scripts/score_live.py"             --history ml/live/history --out ml/live/score.json             || echo "::warning::scoring failed; the forecast is still published and the last score.json is kept"
          # The scorer looks back 7 days; keep 35 daily files so the branch does not grow for ever.
          ls ml/live/history/*.jsonl | sort | head -n -35 | xargs -r rm -f
          git add ml/live
          git commit -q -m "live forecast $(date -u +'%F %H:00') UTC" || { echo "nothing changed"; exit 0; }
          git push -q origin live-data
      - name: show the dry-run result
        if: github.event_name == 'pull_request' && steps.forecast.outputs.code == '0'
        run: python -c "import json; d=json.load(open('$RUNNER_TEMP/forecasts.json')); c=d['data_contract']; print('stations forecast:', len(d['stations']), '| data as of', d['data_as_of_utc'], 'UTC | missing', c['stations_missing'], '| stale', c['stations_stale'], '| sparse', c['stations_sparse']); s=d['stations'][0]; print(s['station'], s['place'], [(f['horizon_h'], f['no2_ppb']) for f in s['forecasts']])"
      - name: summary
        if: always()
        run: |
          if [ "${{ steps.forecast.outputs.code }}" = "2" ]; then
            echo "::warning::No station passed the data contract this hour; the last published forecast stays up."
          fi
      # Alarm: fail the job (so GitHub emails the owner) when what the site reads is more
      # than 3 hours old. Scheduled and manual runs only; the PR dry run publishes nothing.
      - name: stale forecast alarm
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        # The publish step switched the work tree to the live-data branch, which has no
        # scripts: take the checker from the commit this workflow runs at.
        run: |
          git show "${{ github.sha }}:ml/scripts/check_forecast_age.py" > "$RUNNER_TEMP/check_forecast_age.py"
          python "$RUNNER_TEMP/check_forecast_age.py" --max-age-hours 3
