[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auraguard"
version = "0.1.0"
description = "Hourly NO2 forecasting from EPA monitoring stations, with walk-forward backtesting"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# Errors, undefined names and unused imports, import order, and likely bugs.
# Line length is a style choice here, not a gate.
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["auraguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
